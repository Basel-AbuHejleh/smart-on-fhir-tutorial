<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReferralSync - Connecting Care</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0891b2 100%);
        }

        .launch-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 50px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            max-width: 440px;
            width: 90%;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .tagline {
            color: #64748b;
            font-size: 16px;
            margin-bottom: 40px;
        }

        .spinner-container {
            margin: 30px 0;
        }

        .spinner {
            width: 56px;
            height: 56px;
            border: 4px solid #e2e8f0;
            border-top-color: #0891b2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .status {
            color: #475569;
            font-size: 15px;
            margin-top: 20px;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .error-container {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: #fef2f2;
            border-radius: 12px;
            border-left: 4px solid #ef4444;
        }

        .error-container h3 {
            color: #dc2626;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .error-container p {
            color: #7f1d1d;
            font-size: 14px;
        }

        .retry-btn {
            margin-top: 16px;
            padding: 12px 24px;
            background: #0891b2;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .retry-btn:hover {
            background: #0e7490;
        }

        .powered-by {
            margin-top: 40px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>

<body>
    <div class="launch-container">
        <div class="logo">🔗</div>
        <h1>ReferralSync</h1>
        <p class="tagline">Seamless Referral Coordination</p>

        <div class="spinner-container">
            <div class="spinner"></div>
        </div>

        <p class="status">
            <span class="status-dot"></span>
            Authorizing with Cerner...
        </p>

        <div class="error-container" id="error-container">
            <h3>⚠️ Authorization Failed</h3>
            <p id="error-message">Unable to connect to EHR system.</p>
            <button class="retry-btn" onclick="location.reload()">Retry</button>
        </div>

        <p class="powered-by">Powered by SMART on FHIR®</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
    <script>
        // SMART on FHIR Authorization Launch
        // This page initiates the OAuth2 authorization flow

        FHIR.oauth2.authorize({
            'client_id': 'YOUR_CLIENT_ID_HERE',
            'scope': 'launch patient/Patient.read patient/ServiceRequest.read patient/ServiceRequest.write patient/Task.read patient/Task.write patient/Appointment.read patient/Practitioner.read online_access openid profile',
            'redirect_uri': 'index.html'
        }).catch(function (error) {
            console.error('Authorization failed:', error);

            // Show error UI
            document.querySelector('.spinner-container').style.display = 'none';
            document.querySelector('.status').style.display = 'none';

            const errorContainer = document.getElementById('error-container');
            errorContainer.style.display = 'block';
            document.getElementById('error-message').textContent = error.message || 'Unknown authorization error';
        });
    </script>
</body>

</html>
